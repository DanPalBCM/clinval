site_name: clinval
site_description: Validation harness for clinical LLM extraction
site_url: https://danpalbcm.github.io/clinval/
repo_url: https://github.com/DanPalBCM/clinval
repo_name: DanPalBCM/clinval
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Units, windows, alignment: concepts.md
      - Span and ontology matching: matching.md
      - Agreement statistics and CIs: statistics.md
      - Error mechanism taxonomy: errors.md
      - The freeze protocol: freeze.md
      - The runner: runner.md
      - Data formats: formats.md
  - Recipes:
      - Tune, freeze, evaluate: recipes/walkthrough.md
      - Evaluating a LangExtract pipeline: recipes/langextract.md
      - Evaluating fhirground output: recipes/fhirground.md
      - Consensus gating: recipes/consensus.md
      - Error analysis workflow: recipes/error-analysis.md
  - Reference:
      - API: api.md
      - Decisions and deviations: decisions.md
      - Changelog: changelog.md
