bootstrap:
  alpha: 0.05
  cluster_by: patient_id
  n: 1000
  seed: 0
consensus: majority
cost:
  currency: USD
  input_per_1k: 0.003
  output_per_1k: 0.015
freeze:
  grid:
    min_overlap:
    - 0.2
    - 0.35
    - 0.5
    - 0.65
    - 0.8
  objective: cohen_kappa
labels:
- diarrhea
- constipation
matching:
  ontology:
    HPO:
      enabled: true
      fuzzy: false
      prefix_depth: null
      threshold: 0.85
  span:
    fuzzy_threshold: 0.85
    min_overlap: 0.5
    mode: overlap
    require_span: true
metrics:
- cohen_kappa
- pabak
- sensitivity
- specificity
- ppv
- npv
- accuracy
- f1
- prevalence
split: dev
unit: patient_window
window:
  anchor: index_date
  include_prior: false
  n_windows: 2
  size:
    n: 6
    unit: M
  tie_break: earliest
